<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VisiDisc® Order Form — Integrity Tissue Solutions</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', system-ui, sans-serif; background: #f0f4f8; min-height: 100vh; }
    input, select, textarea { font-family: inherit; }
    input[type="radio"] { accent-color: #0c6e6e; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef } = React;

/* ─── DATA ─────────────────────────────────────────────────────────── */
const MOCK_SESSION = {
  repName: "Will Bright",
  repPhone: "(478) 555-0100",
  repEmail: "will@integritytissue.com",
  practiceName: "Atlanta Wound Care Center",
  practiceAddress: "123 Peachtree St",
  practiceCity: "Atlanta",
  practiceState: "GA",
  practiceZip: "30301",
  physicianName: "Dr. Sarah Johnson",
  physicianNPI: "1112223333",
  physicianPhone: "(404) 555-1234",
};

const ICD10_CODES = [
  { code: "H04.131–H04.139", label: "Lacrimal cyst" },
  { code: "H10.021–H10.029", label: "Mucopurulent conjunctivitis" },
  { code: "H16.011–H16.013", label: "Central corneal ulcer" },
  { code: "H16.121–H16.129", label: "Filamentary keratitis" },
  { code: "H16.211–H16.219", label: "Exposure keratoconjunctivitis" },
  { code: "H16.231–H16.239", label: "Neurotrophic keratoconjunctivitis" },
  { code: "H16.8",           label: "Other keratitis" },
  { code: "H18.10 / H18.13", label: "Bullous keratopathy" },
  { code: "H18.421–H18.429", label: "Band keratopathy" },
  { code: "H18.52",          label: "Epithelial (Juvenile) corneal dystrophy" },
  { code: "H18.831–H18.839", label: "Recurrent erosion of cornea" },
  { code: "H18.899",         label: "Persistent epithelial defect" },
  { code: "L51.1",           label: "Stevens-Johnson syndrome" },
  { code: "T26.10–T26.12",   label: "Burn of cornea and conjunctival sac" },
];

const PRODUCTS = {
  thin: {
    label: "Thin (45µm)",
    desc: "Suture-free application with bandage contact lens technique. Ideal for surface conditions requiring a thin, conforming membrane.",
    sizes: [
      { label: "8mm disc",  sku: "VS4508" },
      { label: "10mm disc", sku: "VS4510" },
      { label: "12mm disc", sku: "VS4512" },
    ],
  },
  thick: {
    label: "Thick (200µm)",
    desc: "Greater tissue volume for more substantial corneal and ocular surface conditions. Same room-temperature storage and easy application.",
    sizes: [
      { label: "8mm disc",  sku: "VS20008" },
      { label: "10mm disc", sku: "VS20010" },
      { label: "12mm disc", sku: "VS20012" },
    ],
  },
};

const STEPS = ["Patient", "Diagnosis", "Product", "Shipping", "Review"];

/* ─── HELPERS ────────────────────────────────────────────────────────── */
const makeInitial = () => ({
  // Patient
  firstName: "", lastName: "", dob: "", mrn: "",
  // Diagnosis
  primaryDiagnosis: null,   // { code, label }
  secondaryDiagnosis: null,
  clinicalNotes: "",
  eyeTreated: "",           // "right" | "left" | "bilateral"
  // Product
  variant: "",              // "thin" | "thick"
  discSize: "",             // e.g. "VS4508"
  discSizeLabel: "",
  quantity: 1,
  dateNeededBy: "",
  applicationTechnique: "", // optional note
  // Shipping
  shipToAddress: MOCK_SESSION.practiceAddress,
  shipToCity: MOCK_SESSION.practiceCity,
  shipToState: MOCK_SESSION.practiceState,
  shipToZip: MOCK_SESSION.practiceZip,
  specialInstructions: "",
  // Insurance (optional)
  insuranceName: "", insuranceId: "", groupNumber: "",
  // Internal
  cptCode: "65778",
});

/* ─── APP ─────────────────────────────────────────────────────────────── */
const OCULAR_PRODUCTS = [
  {
    id: "visidisc",
    name: "VisiDisc®",
    manufacturer: "Skye Biologics",
    icon: "👁",
    desc: "FastActing® amniotic membrane allograft for corneal and ocular surface conditions. Available in Thin (45µm) and Thick (200µm), sizes 8mm–12mm. Room temp storage, 5-year shelf life.",
    tag: "Available Now",
    tagColor: "#0c6e6e",
    tagBg: "#f0f9f9",
    disabled: false,
  },
  {
    id: "coming_soon",
    name: "More Ocular Products Coming Soon",
    icon: "⏳",
    desc: "Additional ocular products will be available here as they are added to the portal.",
    tag: "Coming Soon",
    tagColor: "#92400e",
    tagBg: "#fef3c7",
    disabled: true,
  },
];

function ProductSelector({ onSelect }) {
  return (
    <div style={{ minHeight: "100vh", background: "#f0f7f7" }}>
      <div style={{ background: "#0c6e6e", padding: "14px 24px", display: "flex", alignItems: "center", gap: 14 }}>
        <div>
          <div style={{ color: "white", fontWeight: 700, letterSpacing: 2, fontSize: 13 }}>INTEGRITY TISSUE SOLUTIONS</div>
          <div style={{ color: "#7ecece", fontSize: 11, letterSpacing: 1 }}>OCULAR PRODUCTS PORTAL</div>
        </div>
      </div>
      <div style={{ maxWidth: 720, margin: "40px auto", padding: "0 16px" }}>
        <div style={{ marginBottom: 28 }}>
          <h1 style={{ fontSize: 22, fontWeight: 700, color: "#0c6e6e", marginBottom: 6 }}>+ New Order</h1>
          <p style={{ fontSize: 14, color: "#6b7280" }}>Select the ocular product you would like to order.</p>
        </div>
        <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
          {OCULAR_PRODUCTS.map(p => (
            <div key={p.id}
              onClick={() => !p.disabled && onSelect(p.id)}
              style={{ background: "white", borderRadius: 12, padding: "20px 24px", boxShadow: "0 1px 4px rgba(0,0,0,0.08)", border: "2px solid #e5e7eb", cursor: p.disabled ? "not-allowed" : "pointer", opacity: p.disabled ? 0.6 : 1, display: "flex", alignItems: "center", gap: 18 }}
              onMouseEnter={e => { if (!p.disabled) e.currentTarget.style.borderColor = "#0c6e6e"; }}
              onMouseLeave={e => { e.currentTarget.style.borderColor = "#e5e7eb"; }}>
              <div style={{ fontSize: 36, flexShrink: 0 }}>{p.icon}</div>
              <div style={{ flex: 1 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 4, flexWrap: "wrap" }}>
                  <span style={{ fontWeight: 700, fontSize: 15, color: "#111827" }}>{p.name}</span>
                  {p.manufacturer && <span style={{ fontSize: 12, color: "#6b7280" }}>by {p.manufacturer}</span>}
                  <span style={{ fontSize: 11, fontWeight: 600, color: p.tagColor, background: p.tagBg, padding: "2px 8px", borderRadius: 20 }}>{p.tag}</span>
                </div>
                <div style={{ fontSize: 13, color: "#6b7280" }}>{p.desc}</div>
              </div>
              {!p.disabled && <div style={{ fontSize: 20, color: "#9ca3af", flexShrink: 0 }}>→</div>}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function App() {
  const [screen, setScreen] = useState("selector");
  const [step, setStep] = useState(0);
  const [form, setForm] = useState(makeInitial());
  const [submitted, setSubmitted] = useState(false);
  const [diagSearch, setDiagSearch] = useState("");
  const [secDiagSearch, setSecDiagSearch] = useState("");

  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));

  const canProceed = () => {
    if (step === 0) return form.firstName && form.lastName && form.dob;
    if (step === 1) return form.primaryDiagnosis && form.eyeTreated;
    if (step === 2) return form.variant && form.discSize && form.quantity >= 1;
    if (step === 3) return form.shipToAddress && form.shipToCity && form.shipToState && form.shipToZip;
    return true;
  };

  const reset = () => { setForm(makeInitial()); setStep(0); setSubmitted(false); setDiagSearch(""); setSecDiagSearch(""); setScreen("selector"); };

  if (screen === "selector") return <ProductSelector onSelect={(id) => { if (id === "visidisc") setScreen("visidisc"); }} />;
  if (submitted) return <SuccessScreen form={form} onReset={reset} />;

  return (
    <div style={{ minHeight: "100vh", background: "#f0f7f7" }}>
      {/* Header */}
      <div style={{ background: "#0c6e6e", padding: "14px 24px", display: "flex", alignItems: "center", gap: 14 }}>
        <div>
          <div style={{ color: "white", fontWeight: 700, letterSpacing: 2, fontSize: 13 }}>INTEGRITY TISSUE SOLUTIONS</div>
          <div style={{ color: "#7ecece", fontSize: 11, letterSpacing: 1 }}>OCULAR PRODUCTS PORTAL</div>
        </div>
        <div style={{ flex: 1 }} />
        <div style={{ textAlign: "right" }}>
          <div style={{ color: "white", fontSize: 12, fontWeight: 600 }}>VisiDisc® Order Form</div>
          <div style={{ color: "#7ecece", fontSize: 11 }}>CPT 65778 · Skye Biologics</div>
        </div>
      </div>

      <div style={{ maxWidth: 720, margin: "28px auto", padding: "0 16px" }}>
        {/* Progress */}
        <div style={{ background: "white", borderRadius: 12, padding: "18px 24px", marginBottom: 20, boxShadow: "0 1px 4px rgba(0,0,0,0.07)" }}>
          <div style={{ display: "flex" }}>
            {STEPS.map((s, i) => (
              <div key={s} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center" }}>
                <div style={{ display: "flex", alignItems: "center", width: "100%" }}>
                  {i > 0 && <div style={{ flex: 1, height: 2, background: i <= step ? "#0c6e6e" : "#e5e7eb" }} />}
                  <div style={{ width: 28, height: 28, borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center", background: i <= step ? "#0c6e6e" : "#e5e7eb", color: i <= step ? "white" : "#9ca3af", fontSize: 12, fontWeight: 700, flexShrink: 0 }}>
                    {i < step ? "✓" : i + 1}
                  </div>
                  {i < STEPS.length - 1 && <div style={{ flex: 1, height: 2, background: i < step ? "#0c6e6e" : "#e5e7eb" }} />}
                </div>
                <div style={{ fontSize: 10, marginTop: 4, color: i === step ? "#0c6e6e" : "#9ca3af", fontWeight: i === step ? 700 : 400 }}>{s}</div>
              </div>
            ))}
          </div>
        </div>

        {/* Card */}
        <div style={{ background: "white", borderRadius: 12, padding: "28px 32px", boxShadow: "0 1px 4px rgba(0,0,0,0.07)" }}>
          {step === 0 && <StepPatient form={form} set={set} />}
          {step === 1 && <StepDiagnosis form={form} set={set} diagSearch={diagSearch} setDiagSearch={setDiagSearch} secDiagSearch={secDiagSearch} setSecDiagSearch={setSecDiagSearch} />}
          {step === 2 && <StepProduct form={form} set={set} />}
          {step === 3 && <StepShipping form={form} set={set} />}
          {step === 4 && <StepReview form={form} />}

          <div style={{ display: "flex", gap: 12, marginTop: 28, paddingTop: 20, borderTop: "1px solid #f3f4f6" }}>
            {step > 0 && <button onClick={() => setStep(s => s - 1)} style={backBtn}>← Back</button>}
            {step < 4
              ? <button onClick={() => setStep(s => s + 1)} disabled={!canProceed()} style={canProceed() ? nextBtn : nextBtnDisabled}>Continue →</button>
              : <button onClick={() => setSubmitted(true)} style={{ ...nextBtn, background: "#0c6e6e" }}>✓ Confirm Order</button>
            }
          </div>
        </div>

        {/* Footer note */}
        <div style={{ textAlign: "center", marginTop: 14, fontSize: 11, color: "#9ca3af" }}>
          Orders submitted directly to Skye Biologics · orders@skyebiologics.com · (310) 796-5680
        </div>
      </div>
    </div>
  );
}

/* ─── STEP 0: Patient ─────────────────────────────────────────────────── */
function StepPatient({ form, set }) {
  return (
    <div>
      <SectionHeader icon="👤" title="Patient Information" />
      <div style={grid2}>
        <div>
          <Lbl>First Name *</Lbl>
          <Inp value={form.firstName} onChange={e => set("firstName", e.target.value)} placeholder="First name" />
        </div>
        <div>
          <Lbl>Last Name *</Lbl>
          <Inp value={form.lastName} onChange={e => set("lastName", e.target.value)} placeholder="Last name" />
        </div>
        <div>
          <Lbl>Date of Birth *</Lbl>
          <Inp type="date" value={form.dob} onChange={e => set("dob", e.target.value)} />
        </div>
        <div>
          <Lbl>MRN <span style={{ color: "#9ca3af", fontWeight: 400 }}>(optional)</span></Lbl>
          <Inp value={form.mrn} onChange={e => set("mrn", e.target.value)} placeholder="Medical record number" />
        </div>
      </div>

      <div style={{ marginTop: 24, background: "#f0f9f9", borderRadius: 8, padding: "12px 16px", border: "1px solid #b2e0e0" }}>
        <div style={{ fontSize: 12, color: "#0c6e6e", fontWeight: 600, marginBottom: 6 }}>ℹ️ Auto-filled from your account</div>
        <div style={{ fontSize: 13, color: "#374151" }}>
          <strong>Ordering Physician:</strong> {MOCK_SESSION.physicianName} · NPI: {MOCK_SESSION.physicianNPI}<br />
          <strong>Practice:</strong> {MOCK_SESSION.practiceName}<br />
          <strong>Rep:</strong> {MOCK_SESSION.repName} · {MOCK_SESSION.repPhone}
        </div>
      </div>
    </div>
  );
}

/* ─── STEP 1: Diagnosis ───────────────────────────────────────────────── */
function StepDiagnosis({ form, set, diagSearch, setDiagSearch, secDiagSearch, setSecDiagSearch }) {
  const filtered = (q) => ICD10_CODES.filter(c => c.label.toLowerCase().includes(q.toLowerCase()) || c.code.toLowerCase().includes(q.toLowerCase()));

  return (
    <div>
      <SectionHeader icon="🔍" title="Diagnosis" />

      <div style={{ marginBottom: 20 }}>
        <Lbl>Primary Diagnosis (ICD-10) *</Lbl>
        <Inp value={diagSearch} onChange={e => { setDiagSearch(e.target.value); if (form.primaryDiagnosis) set("primaryDiagnosis", null); }} placeholder="Search condition or code..." />
        {diagSearch && !form.primaryDiagnosis && (
          <div style={{ border: "1px solid #e5e7eb", borderRadius: 8, marginTop: 4, overflow: "hidden", boxShadow: "0 2px 8px rgba(0,0,0,0.08)" }}>
            {filtered(diagSearch).length === 0
              ? <div style={{ padding: "10px 14px", fontSize: 13, color: "#9ca3af" }}>No matching codes found</div>
              : filtered(diagSearch).map(c => (
                <div key={c.code} onClick={() => { set("primaryDiagnosis", c); setDiagSearch(`${c.code} — ${c.label}`); }}
                  style={{ padding: "10px 14px", fontSize: 13, cursor: "pointer", borderBottom: "1px solid #f3f4f6", display: "flex", gap: 10 }}
                  onMouseEnter={e => e.currentTarget.style.background = "#f0f9f9"}
                  onMouseLeave={e => e.currentTarget.style.background = "white"}>
                  <span style={{ color: "#0c6e6e", fontWeight: 600, fontFamily: "monospace", fontSize: 12, minWidth: 130 }}>{c.code}</span>
                  <span style={{ color: "#374151" }}>{c.label}</span>
                </div>
              ))
            }
          </div>
        )}
        {form.primaryDiagnosis && (
          <div style={{ marginTop: 6, background: "#f0f9f9", borderRadius: 6, padding: "8px 12px", border: "1px solid #b2e0e0", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <span style={{ fontSize: 13, color: "#0c6e6e", fontWeight: 600 }}>{form.primaryDiagnosis.code}</span>
            <span style={{ fontSize: 13, color: "#374151" }}>{form.primaryDiagnosis.label}</span>
            <button onClick={() => { set("primaryDiagnosis", null); setDiagSearch(""); }} style={{ border: "none", background: "none", cursor: "pointer", color: "#9ca3af", fontSize: 16 }}>✕</button>
          </div>
        )}
      </div>

      <div style={{ marginBottom: 20 }}>
        <Lbl>Secondary Diagnosis <span style={{ color: "#9ca3af", fontWeight: 400 }}>(optional)</span></Lbl>
        <Inp value={secDiagSearch} onChange={e => { setSecDiagSearch(e.target.value); if (form.secondaryDiagnosis) set("secondaryDiagnosis", null); }} placeholder="Search condition or code..." />
        {secDiagSearch && !form.secondaryDiagnosis && (
          <div style={{ border: "1px solid #e5e7eb", borderRadius: 8, marginTop: 4, overflow: "hidden", boxShadow: "0 2px 8px rgba(0,0,0,0.08)" }}>
            {filtered(secDiagSearch).map(c => (
              <div key={c.code} onClick={() => { set("secondaryDiagnosis", c); setSecDiagSearch(`${c.code} — ${c.label}`); }}
                style={{ padding: "10px 14px", fontSize: 13, cursor: "pointer", borderBottom: "1px solid #f3f4f6", display: "flex", gap: 10 }}
                onMouseEnter={e => e.currentTarget.style.background = "#f0f9f9"}
                onMouseLeave={e => e.currentTarget.style.background = "white"}>
                <span style={{ color: "#0c6e6e", fontWeight: 600, fontFamily: "monospace", fontSize: 12, minWidth: 130 }}>{c.code}</span>
                <span style={{ color: "#374151" }}>{c.label}</span>
              </div>
            ))}
          </div>
        )}
        {form.secondaryDiagnosis && (
          <div style={{ marginTop: 6, background: "#f0f9f9", borderRadius: 6, padding: "8px 12px", border: "1px solid #b2e0e0", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <span style={{ fontSize: 13, color: "#0c6e6e", fontWeight: 600 }}>{form.secondaryDiagnosis.code}</span>
            <span style={{ fontSize: 13, color: "#374151" }}>{form.secondaryDiagnosis.label}</span>
            <button onClick={() => { set("secondaryDiagnosis", null); setSecDiagSearch(""); }} style={{ border: "none", background: "none", cursor: "pointer", color: "#9ca3af", fontSize: 16 }}>✕</button>
          </div>
        )}
      </div>

      <div style={{ marginBottom: 20 }}>
        <Lbl>Eye to be Treated *</Lbl>
        <div style={{ display: "flex", gap: 10, marginTop: 6 }}>
          {[["right","👁 Right Eye"],["left","👁 Left Eye"],["bilateral","👁👁 Bilateral"]].map(([val, label]) => (
            <div key={val} onClick={() => set("eyeTreated", val)}
              style={{ flex: 1, padding: "12px 8px", borderRadius: 10, border: `2px solid ${form.eyeTreated === val ? "#0c6e6e" : "#e5e7eb"}`, background: form.eyeTreated === val ? "#f0f9f9" : "white", cursor: "pointer", textAlign: "center", fontSize: 13, fontWeight: form.eyeTreated === val ? 600 : 400, color: form.eyeTreated === val ? "#0c6e6e" : "#374151" }}>
              {label}
            </div>
          ))}
        </div>
      </div>

      <div>
        <Lbl>Clinical Notes <span style={{ color: "#9ca3af", fontWeight: 400 }}>(optional)</span></Lbl>
        <textarea value={form.clinicalNotes} onChange={e => set("clinicalNotes", e.target.value)}
          placeholder="Describe ocular surface condition, severity, prior treatments attempted..."
          style={{ width: "100%", padding: "10px 12px", borderRadius: 8, border: "1px solid #e5e7eb", fontSize: 13, minHeight: 80, resize: "vertical", outline: "none" }} />
      </div>

      <div style={{ marginTop: 16, background: "#fff8f0", borderRadius: 8, padding: "10px 14px", border: "1px solid #fcd34d", fontSize: 12, color: "#92400e" }}>
        ⚠️ <strong>CPT 65778</strong> — "Placement of amniotic membrane on the ocular surface; without sutures." This is an <strong>in-office procedure</strong>. No prior authorization typically required for Medicare. Billable per eye, per encounter.
      </div>
    </div>
  );
}

/* ─── STEP 2: Product Selection ───────────────────────────────────────── */
function StepProduct({ form, set }) {
  const sizes = form.variant ? PRODUCTS[form.variant].sizes : [];

  return (
    <div>
      <SectionHeader icon="🧬" title="Product Selection — VisiDisc®" />

      <div style={{ marginBottom: 20 }}>
        <Lbl>Select Variant *</Lbl>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginTop: 8 }}>
          {Object.entries(PRODUCTS).map(([key, p]) => (
            <div key={key} onClick={() => { set("variant", key); set("discSize", ""); set("discSizeLabel", ""); }}
              style={{ padding: "16px", borderRadius: 10, border: `2px solid ${form.variant === key ? "#0c6e6e" : "#e5e7eb"}`, background: form.variant === key ? "#f0f9f9" : "white", cursor: "pointer" }}>
              <div style={{ fontWeight: 700, color: form.variant === key ? "#0c6e6e" : "#111827", marginBottom: 4 }}>{p.label}</div>
              <div style={{ fontSize: 12, color: "#6b7280", lineHeight: 1.5 }}>{p.desc}</div>
              {form.variant === key && <div style={{ marginTop: 8, fontSize: 11, color: "#0c6e6e", fontWeight: 600 }}>✓ Selected</div>}
            </div>
          ))}
        </div>
      </div>

      {form.variant && (
        <div style={{ marginBottom: 20 }}>
          <Lbl>Disc Size *</Lbl>
          <div style={{ display: "flex", gap: 10, marginTop: 8 }}>
            {sizes.map(s => (
              <div key={s.sku} onClick={() => { set("discSize", s.sku); set("discSizeLabel", s.label); }}
                style={{ flex: 1, padding: "12px", borderRadius: 10, border: `2px solid ${form.discSize === s.sku ? "#0c6e6e" : "#e5e7eb"}`, background: form.discSize === s.sku ? "#f0f9f9" : "white", cursor: "pointer", textAlign: "center" }}>
                <div style={{ fontWeight: 700, color: form.discSize === s.sku ? "#0c6e6e" : "#111827" }}>{s.label}</div>
                <div style={{ fontSize: 11, color: "#9ca3af", marginTop: 2 }}>SKU: {s.sku}</div>
              </div>
            ))}
          </div>
          <div style={{ marginTop: 8, fontSize: 12, color: "#6b7280" }}>
            💡 Select disc size to adequately cover affected area with margin. VisiDisc stays within a 14mm BCL for 8mm–12mm sizes.
          </div>
        </div>
      )}

      <div style={grid2}>
        <div>
          <Lbl>Quantity *</Lbl>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <button onClick={() => set("quantity", Math.max(1, form.quantity - 1))} style={qtyBtn}>−</button>
            <span style={{ fontSize: 18, fontWeight: 700, minWidth: 30, textAlign: "center" }}>{form.quantity}</span>
            <button onClick={() => set("quantity", form.quantity + 1)} style={qtyBtn}>+</button>
          </div>
          <div style={{ fontSize: 11, color: "#9ca3af", marginTop: 4 }}>Shipping: $40 (1–8 units) · $45 (9–20) · $65 (21+)</div>
        </div>
        <div>
          <Lbl>Date Needed By <span style={{ color: "#9ca3af", fontWeight: 400 }}>(optional)</span></Lbl>
          <Inp type="date" value={form.dateNeededBy} onChange={e => set("dateNeededBy", e.target.value)} />
        </div>
      </div>

      <div style={{ marginTop: 20 }}>
        <Lbl>Preferred Application Technique <span style={{ color: "#9ca3af", fontWeight: 400 }}>(optional)</span></Lbl>
        <div style={{ display: "flex", flexDirection: "column", gap: 8, marginTop: 8 }}>
          {["Bandage Contact Lens Technique", "Application Technique with Speculum", "Bandage Contact Lens Technique 2 (Alternative BCL)"].map(t => (
            <label key={t} style={{ display: "flex", alignItems: "center", gap: 8, cursor: "pointer", fontSize: 13, color: "#374151" }}>
              <input type="radio" name="technique" checked={form.applicationTechnique === t} onChange={() => set("applicationTechnique", t)} style={{ accentColor: "#0c6e6e" }} />
              {t}
            </label>
          ))}
        </div>
      </div>

      <div style={{ marginTop: 16, background: "#f0f9f9", borderRadius: 8, padding: "10px 14px", border: "1px solid #b2e0e0", fontSize: 12, color: "#0c6e6e" }}>
        ✅ VisiDisc is ready to apply — no prep time needed. Lays flat, resists wrinkling, adheres naturally. <strong>Room temp storage, 5-year shelf life.</strong>
      </div>
    </div>
  );
}

/* ─── STEP 3: Shipping ─────────────────────────────────────────────────── */
function StepShipping({ form, set }) {
  return (
    <div>
      <SectionHeader icon="📦" title="Shipping & Delivery" />

      <div style={{ background: "#f0f9f9", border: "1px solid #b2e0e0", borderRadius: 8, padding: "10px 14px", marginBottom: 20, fontSize: 13, color: "#0c6e6e" }}>
        ℹ️ Shipping address pre-filled from your practice profile. Update if shipping to a different location.
      </div>

      <div style={{ marginBottom: 14 }}>
        <Lbl>Ship-to Address *</Lbl>
        <Inp value={form.shipToAddress} onChange={e => set("shipToAddress", e.target.value)} placeholder="Street address" />
      </div>
      <div style={grid3}>
        <div style={{ gridColumn: "1/2" }}>
          <Lbl>City *</Lbl>
          <Inp value={form.shipToCity} onChange={e => set("shipToCity", e.target.value)} placeholder="City" />
        </div>
        <div>
          <Lbl>State *</Lbl>
          <Inp value={form.shipToState} onChange={e => set("shipToState", e.target.value)} placeholder="GA" maxLength={2} style={{ textTransform: "uppercase" }} />
        </div>
        <div>
          <Lbl>ZIP *</Lbl>
          <Inp value={form.shipToZip} onChange={e => set("shipToZip", e.target.value)} placeholder="30301" />
        </div>
      </div>

      <div style={{ marginTop: 14 }}>
        <Lbl>Special Delivery Instructions <span style={{ color: "#9ca3af", fontWeight: 400 }}>(optional)</span></Lbl>
        <textarea value={form.specialInstructions} onChange={e => set("specialInstructions", e.target.value)}
          placeholder="e.g. Call before delivery, leave at front desk, attention: Dr. Smith..."
          style={{ width: "100%", padding: "10px 12px", borderRadius: 8, border: "1px solid #e5e7eb", fontSize: 13, minHeight: 70, resize: "vertical", outline: "none", marginTop: 4 }} />
      </div>

      {/* Insurance (collapsible feel) */}
      <div style={{ marginTop: 24, border: "1px solid #e5e7eb", borderRadius: 10, overflow: "hidden" }}>
        <div style={{ background: "#f9fafb", padding: "12px 16px", fontWeight: 600, fontSize: 13, color: "#374151", borderBottom: "1px solid #e5e7eb" }}>
          Insurance Information <span style={{ color: "#9ca3af", fontWeight: 400 }}>(optional)</span>
        </div>
        <div style={{ padding: "16px", display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
          <div style={{ gridColumn: "1/-1" }}>
            <Lbl>Insurance / Payer Name</Lbl>
            <Inp value={form.insuranceName} onChange={e => set("insuranceName", e.target.value)} placeholder="e.g. Medicare, Blue Cross..." />
          </div>
          <div>
            <Lbl>Member ID</Lbl>
            <Inp value={form.insuranceId} onChange={e => set("insuranceId", e.target.value)} placeholder="Insurance member ID" />
          </div>
          <div>
            <Lbl>Group Number</Lbl>
            <Inp value={form.groupNumber} onChange={e => set("groupNumber", e.target.value)} placeholder="Group number" />
          </div>
        </div>
      </div>

      <div style={{ marginTop: 16, fontSize: 12, color: "#6b7280", background: "#fff8f0", borderRadius: 8, padding: "10px 14px", border: "1px solid #fcd34d" }}>
        📋 <strong>Reimbursement estimates (CPT 65778):</strong> Medicare $1,500+ · Private $1,110–$1,700 · Medicaid ~$1,100<br/>
        Zero (0) global period — may be re-applied as often as medically necessary. Billable per eye, per encounter.
      </div>
    </div>
  );
}

/* ─── STEP 4: Review ──────────────────────────────────────────────────── */
function StepReview({ form }) {
  const productLabel = form.variant ? `VisiDisc® ${PRODUCTS[form.variant].label} · ${form.discSizeLabel} · SKU: ${form.discSize}` : "—";

  return (
    <div>
      <SectionHeader icon="✅" title="Review Order" />
      <p style={{ fontSize: 13, color: "#6b7280", marginBottom: 20 }}>Please confirm all details before submitting to Skye Biologics.</p>

      <RevBlock title="Patient">
        <Row label="Name" value={`${form.firstName} ${form.lastName}`} />
        <Row label="Date of Birth" value={form.dob} />
        {form.mrn && <Row label="MRN" value={form.mrn} />}
      </RevBlock>

      <RevBlock title="Ordering Physician">
        <Row label="Physician" value={MOCK_SESSION.physicianName} />
        <Row label="NPI" value={MOCK_SESSION.physicianNPI} />
        <Row label="Practice" value={MOCK_SESSION.practiceName} />
        <Row label="Rep" value={`${MOCK_SESSION.repName} · ${MOCK_SESSION.repPhone}`} />
      </RevBlock>

      <RevBlock title="Diagnosis">
        <Row label="Primary ICD-10" value={form.primaryDiagnosis ? `${form.primaryDiagnosis.code} — ${form.primaryDiagnosis.label}` : "—"} />
        {form.secondaryDiagnosis && <Row label="Secondary ICD-10" value={`${form.secondaryDiagnosis.code} — ${form.secondaryDiagnosis.label}`} />}
        <Row label="Eye Treated" value={form.eyeTreated ? form.eyeTreated.charAt(0).toUpperCase() + form.eyeTreated.slice(1) : "—"} />
        {form.clinicalNotes && <Row label="Clinical Notes" value={form.clinicalNotes} />}
        <Row label="CPT Code" value="65778 — Amniotic membrane placement, ocular surface, without sutures" />
      </RevBlock>

      <RevBlock title="Product">
        <Row label="Product" value={productLabel} />
        <Row label="Quantity" value={`${form.quantity} unit${form.quantity > 1 ? "s" : ""}`} />
        {form.dateNeededBy && <Row label="Needed By" value={form.dateNeededBy} />}
        {form.applicationTechnique && <Row label="Application Technique" value={form.applicationTechnique} />}
      </RevBlock>

      <RevBlock title="Shipping">
        <Row label="Ship To" value={`${form.shipToAddress}, ${form.shipToCity}, ${form.shipToState} ${form.shipToZip}`} />
        {form.specialInstructions && <Row label="Instructions" value={form.specialInstructions} />}
        {form.insuranceName && <Row label="Insurance" value={`${form.insuranceName}${form.insuranceId ? ` · ID: ${form.insuranceId}` : ""}${form.groupNumber ? ` · Group: ${form.groupNumber}` : ""}`} />}
      </RevBlock>

      <div style={{ background: "#f0f9f9", border: "1px solid #b2e0e0", borderRadius: 8, padding: "12px 16px", fontSize: 13, color: "#0c6e6e" }}>
        🔔 After confirming, your ITS rep will review this order and reach out if any additional information is needed before processing.
      </div>
    </div>
  );
}

/* ─── SUCCESS ──────────────────────────────────────────────────────────── */
function SuccessScreen({ form, onReset }) {
  const shippingCost = form.quantity <= 8 ? 40 : form.quantity <= 20 ? 45 : 65;
  return (
    <div style={{ minHeight: "100vh", background: "#f0f7f7", display: "flex", alignItems: "center", justifyContent: "center", padding: 24 }}>
      <div style={{ background: "white", borderRadius: 16, padding: 40, maxWidth: 580, width: "100%", boxShadow: "0 4px 16px rgba(0,0,0,0.08)", textAlign: "center" }}>
        <div style={{ fontSize: 52, marginBottom: 16 }}>✅</div>
        <h2 style={{ color: "#0c6e6e", fontSize: 22, fontWeight: 700, marginBottom: 8 }}>Order Confirmed</h2>
        <p style={{ color: "#6b7280", fontSize: 14, marginBottom: 6 }}>
          Your VisiDisc® order for <strong>{form.firstName} {form.lastName}</strong> has been received.
        </p>
        <p style={{ color: "#6b7280", fontSize: 14, marginBottom: 24 }}>
          Your Integrity Tissue Solutions representative, <strong>{MOCK_SESSION.repName}</strong>, will review and process your order shortly.
        </p>
        <div style={{ background: "#f0f9f9", border: "1px solid #b2e0e0", borderRadius: 10, padding: "16px", marginBottom: 16, textAlign: "left" }}>
          <div style={{ fontWeight: 700, color: "#0c6e6e", marginBottom: 10, fontSize: 13 }}>Order Summary</div>
          <div style={{ fontSize: 13, color: "#374151", display: "flex", flexDirection: "column", gap: 6 }}>
            <div><strong>Product:</strong> VisiDisc® {form.variant ? PRODUCTS[form.variant].label : ""} · {form.discSizeLabel} · SKU: {form.discSize}</div>
            <div><strong>Qty:</strong> {form.quantity} unit{form.quantity > 1 ? "s" : ""} · Shipping: ${shippingCost}</div>
            <div><strong>Diagnosis:</strong> {form.primaryDiagnosis?.label} ({form.primaryDiagnosis?.code})</div>
            <div><strong>Eye Treated:</strong> {form.eyeTreated ? form.eyeTreated.charAt(0).toUpperCase() + form.eyeTreated.slice(1) : "—"}</div>
            <div><strong>Ship to:</strong> {form.shipToAddress}, {form.shipToCity}, {form.shipToState} {form.shipToZip}</div>
          </div>
        </div>
        <div style={{ background: "#f0f9f9", border: "1px solid #b2e0e0", borderRadius: 8, padding: "12px 16px", marginBottom: 24, textAlign: "left" }}>
          <div style={{ fontWeight: 700, color: "#0c6e6e", fontSize: 12, marginBottom: 6 }}>Your ITS Representative</div>
          <div style={{ fontSize: 13, color: "#374151" }}>
            <strong>{MOCK_SESSION.repName}</strong><br/>
            📞 {MOCK_SESSION.repPhone}<br/>
            ✉️ {MOCK_SESSION.repEmail}
          </div>
          <div style={{ fontSize: 12, color: "#6b7280", marginTop: 8 }}>
            For urgent orders or questions, contact your rep directly.
          </div>
        </div>
        <button onClick={onReset} style={{ ...nextBtn, background: "#0c6e6e" }}>+ New Order</button>
      </div>
    </div>
  );
}

/* ─── SHARED ──────────────────────────────────────────────────────────── */
function SectionHeader({ icon, title }) {
  return (
    <div style={{ marginBottom: 20 }}>
      <h2 style={{ fontSize: 18, fontWeight: 700, color: "#0c6e6e", display: "flex", alignItems: "center", gap: 8 }}>
        <span>{icon}</span>{title}
      </h2>
    </div>
  );
}

function RevBlock({ title, children }) {
  return (
    <div style={{ marginBottom: 14, background: "#f9fafb", borderRadius: 8, padding: "12px 16px" }}>
      <div style={{ fontSize: 11, fontWeight: 700, color: "#9ca3af", textTransform: "uppercase", letterSpacing: 1, marginBottom: 8 }}>{title}</div>
      {children}
    </div>
  );
}

function Row({ label, value }) {
  return (
    <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13, marginBottom: 5 }}>
      <span style={{ color: "#6b7280", minWidth: 130 }}>{label}</span>
      <span style={{ fontWeight: 500, color: "#111827", textAlign: "right", maxWidth: "60%" }}>{value || "—"}</span>
    </div>
  );
}

function Lbl({ children }) {
  return <div style={{ fontSize: 13, fontWeight: 500, color: "#374151", marginBottom: 4 }}>{children}</div>;
}

function Inp({ style, ...props }) {
  return <input {...props} style={{ width: "100%", padding: "10px 12px", borderRadius: 8, border: "1px solid #e5e7eb", fontSize: 14, outline: "none", boxSizing: "border-box", ...style }} />;
}

const grid2 = { display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14 };
const grid3 = { display: "grid", gridTemplateColumns: "2fr 1fr 1fr", gap: 12 };
const backBtn = { flex: 1, padding: "12px", borderRadius: 8, border: "1px solid #e5e7eb", background: "white", cursor: "pointer", fontWeight: 600, color: "#374151", fontSize: 14 };
const nextBtn = { flex: 2, padding: "12px", borderRadius: 8, border: "none", background: "#0c6e6e", color: "white", cursor: "pointer", fontWeight: 600, fontSize: 15 };
const nextBtnDisabled = { flex: 2, padding: "12px", borderRadius: 8, border: "none", background: "#e5e7eb", color: "#9ca3af", cursor: "not-allowed", fontWeight: 600, fontSize: 15 };
const qtyBtn = { width: 32, height: 32, borderRadius: 8, border: "1px solid #e5e7eb", background: "white", cursor: "pointer", fontSize: 18, fontWeight: 700, color: "#374151", display: "flex", alignItems: "center", justifyContent: "center" };

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
